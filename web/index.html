<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sydney Eats</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <!-- Leaflet CSS for Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-200 font-sans transition-colors duration-200">
    
    <!-- Navbar -->
    <nav class="bg-white dark:bg-gray-800 shadow-sm p-4 sticky top-0 z-50 transition-colors duration-200">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold text-indigo-600 dark:text-indigo-400">Sydney Eats</h1>
            <div class="flex gap-4 items-center">
                <button id="date-creator-btn" class="text-pink-600 dark:text-pink-400 hover:text-pink-800 dark:hover:text-pink-300 font-bold border border-pink-600 dark:border-pink-400 rounded px-2 py-1">Itineraries & Crawls 🍻</button>
                <button id="toggle-map-btn" class="text-gray-600 dark:text-gray-300 hover:text-indigo-600 dark:hover:text-indigo-400 font-medium">Toggle Map</button>
                <button id="view-saved-btn" class="text-gray-600 dark:text-gray-300 hover:text-indigo-600 dark:hover:text-indigo-400 font-medium">Saved Spots</button>
                <button id="share-btn" class="text-indigo-600 dark:text-indigo-400 hover:text-indigo-800 dark:hover:text-indigo-300 font-semibold border border-indigo-600 dark:border-indigo-400 rounded px-2 py-1">Share List</button>
                <button id="dark-mode-btn" class="text-xl pl-2">🌙</button>
            </div>
        </div>
    </nav>

    <!-- Map Container (Hidden by default or full width) -->
    <div id="map-container" class="w-full h-96 hidden border-b border-gray-200 shadow-inner">
        <div id="map" class="w-full h-full"></div>
    </div>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto p-4 flex flex-col md:flex-row gap-6">
        
        <!-- Sidebar Filters -->
        <aside class="w-full md:w-1/4 bg-white dark:bg-gray-800 p-6 rounded-lg shadow-sm border border-gray-100 dark:border-gray-700 h-fit transition-colors duration-200">
            <h2 class="text-lg font-semibold mb-4 text-gray-900 dark:text-gray-100">Filters</h2>
            
            <!-- Search -->
            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Search</label>
                <input type="text" id="search-input" placeholder="Search places..." class="w-full border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-md shadow-sm p-2 border focus:ring-indigo-500 focus:border-indigo-500">
            </div>

            <!-- Price Range -->
            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Price Range</label>
                <div class="flex flex-col gap-2 text-gray-800 dark:text-gray-300">
                    <label class="inline-flex items-center"><input type="checkbox" value="$" class="price-filter rounded text-indigo-600 border-gray-300"> <span class="ml-2">$ (Cheap Eats)</span></label>
                    <label class="inline-flex items-center"><input type="checkbox" value="$$" class="price-filter rounded text-indigo-600 border-gray-300"> <span class="ml-2">$$ (Moderate)</span></label>
                    <label class="inline-flex items-center"><input type="checkbox" value="$$$" class="price-filter rounded text-indigo-600 border-gray-300"> <span class="ml-2">$$$ (Expensive)</span></label>
                </div>
            </div>

            <!-- Vibes -->
            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Vibe</label>
                <div id="vibe-filters" class="flex flex-wrap gap-2 text-gray-800 dark:text-gray-300">
                    <!-- Checkboxes will be injected here -->
                </div>
            </div>
        </aside>

        <!-- Places Grid -->
        <section class="w-full md:w-3/4">
            <div class="flex justify-between items-center mb-4 text-gray-900 dark:text-gray-100">
                <h2 class="text-xl font-semibold"><span id="results-count">0</span> Places Found</h2>
            </div>
            
            <div id="places-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Place Cards will be injected here -->
            </div>
        </section>
    </main>

    <!-- Date Creator Modal -->
    <div id="date-modal" class="fixed inset-0 bg-black bg-opacity-50 z-[9999] hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-gray-800 rounded-xl shadow-2xl max-w-5xl w-full max-h-[90vh] overflow-y-auto p-6 relative transition-colors duration-200">
            <button id="close-modal-btn" class="absolute top-4 right-4 text-gray-500 hover:text-gray-800 dark:hover:text-white text-2xl font-bold">&times;</button>
            
            <h2 class="text-3xl font-bold text-center text-pink-600 dark:text-pink-400 mb-2">💘 Itinerary & Crawl Creator</h2>
            <p class="text-center text-gray-600 dark:text-gray-300 mb-6">Let us randomly generate the perfect pairing for your next outing.</p>
            
            <div class="flex flex-wrap gap-4 mb-8 items-end justify-center bg-pink-50 dark:bg-gray-700 p-4 rounded-lg">
                <div class="flex flex-col">
                    <label class="font-semibold text-sm mb-1 text-gray-700 dark:text-gray-200">Stops:</label>
                    <select id="date-stops-select" class="w-48 p-2 rounded border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-200 text-sm">
                        <option value="2">2 Stops (Act + Food)</option>
                        <option value="3">3 Stops (Act + Bar + Food)</option>
                        <option value="bar3">3 Bars (Bar Crawl)</option>
                        <option value="bar4">4 Bars (Epic Crawl)</option>
                    </select>
                </div>
                <div class="flex flex-col">
                    <label class="font-semibold text-sm mb-1 text-gray-700 dark:text-gray-200">Max Distance (km):</label>
                    <input type="range" id="date-distance" min="1" max="20" value="5" class="w-32 mb-1">
                    <span id="date-distance-val" class="text-center text-xs text-gray-600 dark:text-gray-300">5 km</span>
                </div>
                <div class="flex flex-col">
                    <label class="font-semibold text-sm mb-1 text-gray-700 dark:text-gray-200">Dinner Vibe:</label>
                    <select id="date-vibe-select" class="w-40 p-2 rounded border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-200 text-sm">
                        <option value="Any">Any Vibe</option>
                        <option value="🍷 Date Night">🍷 Date Night</option>
                        <option value="🤫 Hidden Gem">🤫 Hidden Gem</option>
                        <option value="🌅 Great Views">🌅 Great Views</option>
                        <option value="🍽️ Great Dining">🍽️ Great Dining</option>
                        <option value="🍸 Drinks & Bar">🍸 Drinks & Bar</option>
                        <option value="💸 Cheap Eats">💸 Cheap Eats</option>
                    </select>
                </div>
                <button id="generate-date-btn" class="bg-pink-600 hover:bg-pink-700 text-white font-bold py-2 px-6 rounded-lg shadow-lg transform transition hover:scale-105">
                    Generate!
                </button>
            </div>
            
            <div id="date-results" class="hidden">
                <h3 class="text-xl font-bold text-center mb-6 text-gray-800 dark:text-white" id="date-title">Your Custom Itinerary</h3>
                <div id="date-cards-container" class="grid grid-cols-1 md:grid-cols-2 gap-6 relative">
                    <!-- Cards injected here -->
                </div>
                <p id="date-distance-calc" class="text-center mt-6 font-semibold text-indigo-600 dark:text-indigo-400"></p>
            </div>
            
            <div id="date-error" class="hidden text-center text-red-500 font-bold p-6">
                Couldn't find a matching itinerary within that distance! Try increasing the radius or changing the vibe.
            </div>
        </div>
    </div>
    
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="data.js?v=17"></script>
    <script src="app.js?v=35"></script>
</body>
</html>
